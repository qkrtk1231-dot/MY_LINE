name: Build MY LINE APK (no local tools)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  android-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout files
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
      - name: Install platform and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK for download
        uses: actions/upload-artifact@v4
        with:
          name: MY_LINE_v19_APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
