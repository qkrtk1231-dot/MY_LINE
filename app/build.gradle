}

android {
    namespace 'com.myline.tracker'
    compileSdk 35

    defaultConfig {
        applicationId 'com.myline.tracker'
        minSdk 26
        targetSdk 34
        versionCode 19
        versionName '19.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
